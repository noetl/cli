[workspace]
# Cargo workspace.  The CLI binary remains the root package; `executor`
# is a workspace member crate that hosts the shared execution core
# (LocalPlaybookSource for the CLI's `noetl run --runtime local` path
# and NatsCommandSource for noetl-worker — see Appendix H of the
# global hybrid cloud blueprint, https://noetl.dev/docs/architecture/
# noetl_global_hybrid_cloud_grid_distributed_architecture_blueprint).
members = ["executor"]

[package]
name = "noetl"
version = "2.23.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/noetl/noetl"
homepage = "https://noetl.io"
description = "NoETL workflow automation CLI - Execute playbooks locally or orchestrate distributed pipelines"
keywords = ["workflow", "automation", "etl", "mlops", "data-pipeline"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "noetl"
path = "src/main.rs"

[[bin]]
name = "ntl"
path = "src/main.rs"

[dependencies]
# Workspace member crate shipping the shared execution core.  R-1.1
# PR-2a moves the YAML playbook types out of playbook_runner.rs into
# noetl-executor::playbook so both the CLI and noetl-worker (R-1.3)
# operate on the same data model.  See Appendix H of the global hybrid
# cloud blueprint.
noetl-executor = { path = "executor" }

clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
tokio = { version = "1", features = ["full", "process"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
base64 = "0.22"
anyhow = "1.0"
ratatui = "0.26"
crossterm = "0.27"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.31"
nix = { version = "0.29", features = ["signal", "process"] }
duckdb = { version = "1.0", features = ["bundled"] }
tempfile = "3.10"
shellexpand = "3.1"
regex = "1.10"
rhai = { version = "1.18", features = ["sync"] }
rpassword = "3"
rand = "0.8"
sha2 = "0.10"
url = "2.5"
