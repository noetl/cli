[workspace]
# Cargo workspace.  The CLI binary remains the root package; sibling
# crates host shared infrastructure:
#
# - `executor` — the shared execution core (LocalPlaybookSource for
#   the CLI's `noetl run --runtime local` path, NatsCommandSource for
#   noetl-worker).  See Appendix H of the global hybrid cloud
#   blueprint, https://noetl.dev/docs/architecture/
#   noetl_global_hybrid_cloud_grid_distributed_architecture_blueprint
# - `arrow-cache` — Rust mirror of Python's
#   `ArrowIpcSharedMemoryCache`.  Same-node zero-copy IPC for the
#   columnar data plane.  R-2.1 in the Rust migration roadmap.
# - `arrow-flight-client` — Rust client for the noetl-server's
#   Arrow Flight `do_get` endpoint.  R-2.3 Phase B; pairs with the
#   Python server in noetl/noetl#643.
# - `events` — shared `ExecutorEvent` envelope + `EventSink` trait.
#   Carved out of `executor::events` as EE-4 of noetl/ai-meta#49 so
#   noetl-server can link the canonical event-envelope shape
#   without dragging in the rest of the executor's surface.
#   `noetl-executor::events` re-exports every symbol verbatim so
#   existing call sites in the cli + noetl-worker work unchanged.
members = ["events", "executor", "arrow-cache", "arrow-flight-client"]

[package]
name = "noetl"
version = "4.17.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/noetl/noetl"
homepage = "https://noetl.io"
description = "NoETL workflow automation CLI - Execute playbooks locally or orchestrate distributed pipelines"
keywords = ["workflow", "automation", "etl", "mlops", "data-pipeline"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "noetl"
path = "src/main.rs"

[[bin]]
name = "ntl"
path = "src/main.rs"

[features]
# Enabled by default so every cli build path (cargo install, apt, homebrew)
# keeps the DuckDB capability.
default = ["duckdb-integration"]
# DuckDB integration — passthrough to `noetl-tools/duckdb-integration`.  The cli
# routes `duckdb` / `ducklake` tool steps through `noetl_tools::tools::DuckdbTool`
# (via noetl-executor's tools_bridge — see playbook_runner.rs).  noetl-tools
# >= 3.20.0 gates the DuckDB C++ engine (`libduckdb-sys`) behind this non-default
# feature (noetl/ai-meta#185); enabling it here keeps cli's noetl-tools DuckDB
# path REAL after cli re-pins to 3.20.0 (otherwise DuckdbTool becomes a stub
# that errors at dispatch).
#
# In `default` (unlike noetl/worker#183, which keeps it out of default for a fast
# dev build): the cli already compiles DuckDB via its own `duckdb` dependency
# below, so this passthrough adds ZERO build cost — the same libduckdb-sys node
# is shared by feature unification.  Keeping it off default would pay the DuckDB
# compile anyway AND leave the noetl-tools path a stub — worst of both.
# REQUIRES noetl-tools >= 3.20.0 (the version that introduced the feature).
duckdb-integration = ["noetl-tools/duckdb-integration"]

[dependencies]
# Workspace member crate shipping the shared execution core.  R-1.1
# PR-2a moves the YAML playbook types out of playbook_runner.rs into
# noetl-executor::playbook so both the CLI and noetl-worker (R-1.3)
# operate on the same data model.  See Appendix H of the global hybrid
# cloud blueprint.
#
# Both `path` and `version` are specified per Cargo's recommendation
# for workspace members that are also published to crates.io: local
# dev uses the path; `cargo publish` resolves against the crates.io
# version constraint.  R-1.2 PR-1 set the executor's `publish = true`
# so this dependency can be satisfied from crates.io.
noetl-executor = { path = "executor", version = "0.7" }

# noetl/ai-meta#90 Phase 6 — the `noetl subscribe` local-mode listener
# reuses the same source clients (`build_source`), header-directive engine,
# and store-and-forward spool engine the in-cluster worker runtime uses, so
# the event model is identical across CLI-local / in-cluster / Cloud Run.
# `noetl-tools` "3.25" pins the round-5 provider surface — the query I/O
# adapter halves the `noetl provider {plan,drift,orphans,adopt}` CLI verbs call:
# `provider_state::extract_facts_from_tier_records` (raw eventlog-tier fold that
# unwraps the wire `payload` string + finds the deeply-nested fact),
# `detect_orphans_scoped` + `detect_stack_conflicts` (stack-scoped ownership).
# This is a HARD compile dependency (not the round-2..4 serde-ignored field
# passthrough) — the CLI PR needs noetl-tools 3.25 on crates.io to build.
# Default features pull in the pubsub + kafka + gcs source/backends.
# `noetl-events` is the shared `EventSink` trait + `ExecutorEvent` envelope the
# local `FileEventSink` implements (same wire shape as the worker's NATS/HTTP sinks).
noetl-tools = "3.25"
noetl-events = { path = "events", version = "0.1.0" }
async-trait = "0.1"

clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
tokio = { version = "1", features = ["full", "process"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
base64 = "0.22"
anyhow = "1.0"
ratatui = "0.26"
crossterm = "0.27"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.31"
nix = { version = "0.29", features = ["signal", "process"] }
duckdb = { version = "1.0", features = ["bundled"] }
shellexpand = "3.1"
regex = "1.10"
rhai = { version = "1.18", features = ["sync"] }
rpassword = "3"
rand = "0.8"
sha2 = "0.10"
url = "2.5"
