[package]
name = "noetl-executor"
# 0.7.0 — noetl/ai-meta#189 provider tool round 4 (drift adoption).  Adds
# `reconcile` + `known_desired` fields to the `Tool::Provider` variant of
# `playbook::Tool`.  New public fields on a non-#[non_exhaustive] struct
# variant are a breaking API change → minor bump under 0.x SemVer.  Per the
# 0.6.0 note below, this bump is LOAD-BEARING for the release: executor 0.6.0
# is already on crates.io *without* these fields, and the `publish-crate` job
# skips republishing an existing version — so leaving 0.6.0 would make the
# `noetl` bin resolve the round-4-less executor from crates.io and ship the
# reconcile/adopt surface dead.
#
# 0.6.0 — noetl/ai-meta#189 provider tool.  Adds the `Tool::Provider`
# variant to `playbook::Tool` (cli commits 75edc68 + 8436790, shipped in
# noetl v4.14.0 / v4.15.0).  `Tool` is a plain (non-#[non_exhaustive])
# enum, so a new variant is a breaking API change → minor bump under 0.x
# SemVer.  THIS BUMP IS LOAD-BEARING FOR THE RELEASE: the source gained
# the variant in v4.14.0 but the version stayed 0.5.0, which was already
# on crates.io *without* the variant.  The release-cli `publish-crate`
# job skips republishing an existing version, so the `noetl` bin's
# `cargo publish` verify build kept resolving noetl-executor 0.5.0 from
# crates.io and failing with `E0599: no variant named Provider`.  Any
# future change to this crate's public surface MUST bump this version in
# the same change set, or the bin publish silently breaks again.
#
# 0.5.0 — noetl/ai-meta#77 (explicit input:/set: forward-only data
# binding).  noetl-tools v3.0.0 is a breaking change: TaskSequenceTool
# replaces _prev/_results injection with explicit set:/input: forward-
# only data binding.  Bumped from noetl-tools "2.21" → "3" so both the
# CLI and noetl-worker resolve to the same major version.
version = "0.8.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/noetl/cli"
homepage = "https://noetl.io"
description = "NoETL shared execution core — utilities and types shared between the noetl CLI's local-mode runner and the noetl-worker NATS pull consumer."
readme = "README.md"
keywords = ["noetl", "etl", "workflow", "automation", "executor"]
categories = ["development-tools"]
# R-1.2 PR-1: published to crates.io so `noetl` (the bin in this
# workspace) can satisfy its dependency from crates.io, and so the
# noetl-worker repo can depend on `noetl-executor = "0.1"` for R-1.2
# onwards.  See § H.10 of Appendix H of the global hybrid cloud
# blueprint for the architectural rationale.

[dependencies]
# Async runtime; matches the CLI's tokio surface so the shared crate
# can run inside either the CLI or the worker binary.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"

# Serialization for command + event envelopes.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# JSON Schema generation for the playbook document model (noetl/ai-meta#201).
# Optional: only the CLI's `noetl schema` needs it, so the crate stays lean for
# the worker, which depends on this crate but never generates a schema.
# schemars 1.x emits draft 2020-12, matching the reference schema this replaces.
schemars = { version = "1", optional = true }

# Error handling.
anyhow = "1.0"
thiserror = "1.0"

# Time + UUID for event ids and timestamps.
chrono = { version = "0.4", features = ["serde"] }

# EE-4 (noetl/ai-meta#49 follow-up): canonical event envelope +
# sink lives in the sibling `noetl-events` crate.  The executor's
# `events` module re-exports its surface verbatim so existing
# call sites (cli local-mode runner, noetl-worker via
# `pub use noetl_executor::events::ExecutorEvent`) keep working.
# Path dep within the workspace; once `noetl-events` ships on
# crates.io (EE-4 PR 2) this can flip to a versioned dep with a
# fallback path.
noetl-events = { version = "0.1.0", path = "../events" }

# Tracing.
tracing = "0.1"

# Template + condition utilities (R-1.1 PR-2b extraction from
# playbook_runner.rs per § H.10.3 of Appendix H).
regex = "1.10"
rhai = { version = "1.18", features = ["sync"] }

# Tool registry (R-1.1 PR-2c-1 per Appendix H § H.10.4).  Pinned to
# match `repos/worker` so both binaries that depend on noetl-executor
# resolve to the same noetl-tools version.  Bridge layer in
# noetl-executor::tools_bridge maps the CLI's YAML-parsed `Tool` enum
# (from noetl-executor::playbook) onto the registry's dispatch API.
#
# Subsequent sub-PRs (PR-2c-2 onwards per Strategy B) replace one
# inline tool implementation in playbook_runner.rs at a time so
# semantic differences surface incrementally instead of all at once.
noetl-tools = "3.26"

# GCS uploads in `tools_bridge::gcs_upload` (R-3 GCS sink migration,
# noetl/ai-meta#31).  The `gcp` feature pulls in
# `object_store::gcp::GoogleCloudStorageBuilder` and the required
# `reqwest`-backed HTTP transport.  No `aws` / `azure` features —
# those adapters ship in separate follow-up issues.
object_store = { version = "0.11", features = ["gcp"] }
# bytes::Bytes is the upload payload type for object_store; listed
# explicitly so the version contract is visible and to avoid relying
# on the transitive dep from object_store.
bytes = "1"

[features]
# Derive JsonSchema on the playbook document model.
json-schema = ["dep:schemars"]
# DuckDB integration — passthrough to `noetl-tools/duckdb-integration`.
# noetl-tools >= 3.20.0 gates the DuckDB C++ engine (libduckdb-sys) behind a
# non-default feature (noetl/ai-meta#185) so builds that never run duckdb steps
# skip the multi-hour C++ compile.  noetl-executor routes `duckdb` steps through
# `noetl_tools::tools::DuckdbTool` in `tools_bridge`, so its DuckDB path is a
# stub unless that feature is enabled.  Off by default here (matching
# noetl-worker's fast-build default); the cli enables it via its own default
# passthrough, and feature unification turns it on for the whole cli build
# graph.  The bridge's real-duckdb dispatch test is gated on this feature.
default = []
duckdb-integration = ["noetl-tools/duckdb-integration"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
