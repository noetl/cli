[package]
name = "noetl-executor"
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/noetl/cli"
homepage = "https://noetl.io"
description = "NoETL shared execution core — utilities and types shared between the noetl CLI's local-mode runner and the noetl-worker NATS pull consumer."
readme = "README.md"
keywords = ["noetl", "etl", "workflow", "automation", "executor"]
categories = ["development-tools"]
# R-1.2 PR-1: published to crates.io so `noetl` (the bin in this
# workspace) can satisfy its dependency from crates.io, and so the
# noetl-worker repo can depend on `noetl-executor = "0.1"` for R-1.2
# onwards.  See § H.10 of Appendix H of the global hybrid cloud
# blueprint for the architectural rationale.

[dependencies]
# Async runtime; matches the CLI's tokio surface so the shared crate
# can run inside either the CLI or the worker binary.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"

# Serialization for command + event envelopes.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling.
anyhow = "1.0"
thiserror = "1.0"

# Time + UUID for event ids and timestamps.
chrono = { version = "0.4", features = ["serde"] }

# Tracing.
tracing = "0.1"

# Template + condition utilities (R-1.1 PR-2b extraction from
# playbook_runner.rs per § H.10.3 of Appendix H).
regex = "1.10"
rhai = { version = "1.18", features = ["sync"] }

# Tool registry (R-1.1 PR-2c-1 per Appendix H § H.10.4).  Pinned to
# match `repos/worker` so both binaries that depend on noetl-executor
# resolve to the same noetl-tools version.  Bridge layer in
# noetl-executor::tools_bridge maps the CLI's YAML-parsed `Tool` enum
# (from noetl-executor::playbook) onto the registry's dispatch API.
#
# Subsequent sub-PRs (PR-2c-2 onwards per Strategy B) replace one
# inline tool implementation in playbook_runner.rs at a time so
# semantic differences surface incrementally instead of all at once.
noetl-tools = "2.8.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
