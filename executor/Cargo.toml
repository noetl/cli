[package]
name = "noetl-executor"
# 0.4.1 — noetl/ai-meta#43 Round 4 follow-up.  noetl-tools 2.21
# added a new `pending_callback: Option<bool>` field on
# `ToolResult` (the marker the new `Tool::Container` sets to
# signal that `call.done` arrives asynchronously via a server-side
# callback path).  Adding a non-Default field to a public struct
# breaks struct-literal call sites — the bridge's
# `reshape_duckdb_result` reconstructs a `ToolResult` by-field, so
# this patch bump just propagates `result.pending_callback` through
# the bridge unchanged.  No API surface change on the executor
# itself, hence patch-level rather than minor.
version = "0.4.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/noetl/cli"
homepage = "https://noetl.io"
description = "NoETL shared execution core — utilities and types shared between the noetl CLI's local-mode runner and the noetl-worker NATS pull consumer."
readme = "README.md"
keywords = ["noetl", "etl", "workflow", "automation", "executor"]
categories = ["development-tools"]
# R-1.2 PR-1: published to crates.io so `noetl` (the bin in this
# workspace) can satisfy its dependency from crates.io, and so the
# noetl-worker repo can depend on `noetl-executor = "0.1"` for R-1.2
# onwards.  See § H.10 of Appendix H of the global hybrid cloud
# blueprint for the architectural rationale.

[dependencies]
# Async runtime; matches the CLI's tokio surface so the shared crate
# can run inside either the CLI or the worker binary.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"

# Serialization for command + event envelopes.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling.
anyhow = "1.0"
thiserror = "1.0"

# Time + UUID for event ids and timestamps.
chrono = { version = "0.4", features = ["serde"] }

# EE-4 (noetl/ai-meta#49 follow-up): canonical event envelope +
# sink lives in the sibling `noetl-events` crate.  The executor's
# `events` module re-exports its surface verbatim so existing
# call sites (cli local-mode runner, noetl-worker via
# `pub use noetl_executor::events::ExecutorEvent`) keep working.
# Path dep within the workspace; once `noetl-events` ships on
# crates.io (EE-4 PR 2) this can flip to a versioned dep with a
# fallback path.
noetl-events = { version = "0.1.0", path = "../events" }

# Tracing.
tracing = "0.1"

# Template + condition utilities (R-1.1 PR-2b extraction from
# playbook_runner.rs per § H.10.3 of Appendix H).
regex = "1.10"
rhai = { version = "1.18", features = ["sync"] }

# Tool registry (R-1.1 PR-2c-1 per Appendix H § H.10.4).  Pinned to
# match `repos/worker` so both binaries that depend on noetl-executor
# resolve to the same noetl-tools version.  Bridge layer in
# noetl-executor::tools_bridge maps the CLI's YAML-parsed `Tool` enum
# (from noetl-executor::playbook) onto the registry's dispatch API.
#
# Subsequent sub-PRs (PR-2c-2 onwards per Strategy B) replace one
# inline tool implementation in playbook_runner.rs at a time so
# semantic differences surface incrementally instead of all at once.
noetl-tools = "2.21"

# GCS uploads in `tools_bridge::gcs_upload` (R-3 GCS sink migration,
# noetl/ai-meta#31).  The `gcp` feature pulls in
# `object_store::gcp::GoogleCloudStorageBuilder` and the required
# `reqwest`-backed HTTP transport.  No `aws` / `azure` features —
# those adapters ship in separate follow-up issues.
object_store = { version = "0.11", features = ["gcp"] }
# bytes::Bytes is the upload payload type for object_store; listed
# explicitly so the version contract is visible and to avoid relying
# on the transitive dep from object_store.
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
