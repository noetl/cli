# noetl/ai-meta#232 — actually run the tests.
#
# Before this workflow, no GitHub Actions workflow in this repo ran `cargo test`
# (nor in noetl/server, noetl/worker, noetl/tools).  The release workflow builds and publishes; nothing executed
# a test.
#
# That is worse than having no tests, because these crates carry hundreds of them
# and they read as a safety net.  A guard no runner executes cannot fail, and a
# guard that cannot fail is indistinguishable from one that was never written —
# which is not hypothetical: adding this workflow to noetl/worker immediately
# surfaced a test that had been asserting a defect closed some time earlier
# (noetl/ai-meta#209), with nobody the wiser.
#
# Deliberately NOT here:
#   * `cargo fmt --check` — these crates are formatted with rustfmt 1.9.0 and a
#     different version reformats large parts of the tree.
#
# `-D warnings` IS here as of noetl/ai-meta#378.  It was deliberately omitted when
# this workflow was written, because 39 pre-existing lints would have made it
# start red for reasons no individual PR caused.  33 of those are now fixed and
# two more are covered by a raised threshold in clippy.toml, leaving the two
# exceptions below.  The gate starts green and a new lint is the only thing that
# can turn it red.
name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: `git describe --tags` finds nothing on the
          # default shallow clone, and the member check would SKIP — a clean
          # result computed from no baseline at all.
          fetch-depth: 0
          fetch-tags: true

      # noetl/ai-meta#331 — a member crate changed without a version bump
      # releases green and publishes nothing new.  Catch it on the PR, where it
      # costs a comment, not after the tag is cut.
      - name: member versions
        run: ./ci/check-member-versions.sh

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # --all-targets, not the default: plain cargo build/test skip integration
      # tests and cfg(test)-only code, so a binary can be broken while the lib
      # compiles clean.
      #
      # ⚠ --workspace, and it is NOT redundant with --all-targets.  The two
      # flags widen different axes: --all-targets widens TARGET KINDS (lib,
      # bins, tests, examples) within the selected packages; --workspace widens
      # the PACKAGE SELECTION.  This repo's root Cargo.toml is a real
      # `[package]` (the `noetl` bin) as well as a `[workspace]`, so the
      # default selection is that root package ALONE — `events`, `executor`,
      # `arrow-cache` and `arrow-flight-client` were never built or tested
      # here.  Measured: the old command ran 69 tests, this one runs 161.
      #
      # That is not hypothetical.  `noetl-executor`'s
      # `dispatch_provider_apply_without_auth_errors_no_network` was failing on
      # main for eight days while every CI run reported success, because the
      # package holding it was never selected.  A gate that does not run the
      # tests is not a gate, and this one's own comment reasoned carefully
      # about the wrong axis.
      - name: build (all targets)
        run: cargo build --workspace --all-targets --locked

      - name: test
        run: cargo test --workspace --all-targets --locked

      # Gating since noetl/ai-meta#378, proven to fail on a planted lint before
      # this form was committed -- a lint gate never seen to go red is
      # indistinguishable from one that cannot.
      #
      # The two -A entries below are the only exceptions, and each one states
      # why it cannot simply be fixed.  An unexplained -A is how a gate quietly
      # stops gating; if one appears here without a reason, that is the bug.
      # Both are tracked on noetl/ai-meta#378.
      #
      #   large_enum_variant -- EhdbQueryCommand (src/lib.rs:592), Tool
      #     (executor/src/playbook.rs:393) and ToolSpecDoc (:1149) are clap
      #     Subcommand and serde tagged/untagged derive enums.  The suggested
      #     fix is boxing the large variants, but Tool is also derived under
      #     the json-schema feature that GENERATES the published DSL schema,
      #     so boxing would change that schema's output.  That is a downstream
      #     contract change, not a local cleanup.
      #
      #   result_large_err -- the large Err is tonic::Status, an upstream type
      #     we do not control ("try reducing the size of tonic::Status"), and
      #     the only site is a test helper in arrow-flight-client/src/tests.rs.
      #
      # clippy.toml raises too-many-arguments-threshold to 8 for the two 8-arg
      # functions in src/lib.rs.  That is deliberately a threshold and not an
      # -A: a function growing to 9 arguments still fails (verified).
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -A clippy::large_enum_variant -A clippy::result_large_err
