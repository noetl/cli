name: "Semantic Release ⚙️"

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24.2.3
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
            @semantic-release/exec@v7.1.0
            conventional-changelog-conventionalcommits@8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and upload release assets
        # Repo variable RELEASE_BUILDS_ON_MERGE=false stops the automatic release
        # build (multi-arch images / binaries on GHA runners) after every merge;
        # the tag + notes are still created and the build is run on our machines
        # (ops scripts/local-build) or dispatched by hand. Unset = old behaviour.
        if: ${{ steps.semantic.outputs.new_release_published == 'true' && vars.RELEASE_BUILDS_ON_MERGE != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)"
          gh workflow run release.yml --ref main -f version="${VERSION}"

      - name: Release build left to the local build hosts
        if: ${{ steps.semantic.outputs.new_release_published == 'true' && vars.RELEASE_BUILDS_ON_MERGE == 'false' }}
        run: |
          echo "::notice::v${{ steps.semantic.outputs.new_release_version }} tagged; release build NOT dispatched (RELEASE_BUILDS_ON_MERGE=false)."
          echo "Build it on the AMD box / Mac Studio (noetl/ops scripts/local-build) or run: gh workflow run release.yml -f version=${{ steps.semantic.outputs.new_release_version }}"
