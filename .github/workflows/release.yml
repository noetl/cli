name: release-cli

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 2.8.8). Leave empty for current Cargo.toml."
        required: false
        type: string

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          INPUT_VERSION="$(jq -r '.inputs.version // empty' "${GITHUB_EVENT_PATH}" 2>/dev/null || true)"
          CARGO_VERSION=$(grep -E '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            TAG_VERSION="${TAG#v}"
            if [[ "${TAG_VERSION}" != "${CARGO_VERSION}" ]]; then
              echo "Tag version ${TAG_VERSION} does not match Cargo.toml version ${CARGO_VERSION}"
              exit 1
            fi
          elif [[ -n "${INPUT_VERSION}" ]]; then
            TAG="v${INPUT_VERSION}"
            if [[ "${INPUT_VERSION}" != "${CARGO_VERSION}" ]]; then
              echo "Input version ${INPUT_VERSION} does not match Cargo.toml version ${CARGO_VERSION}"
              exit 1
            fi
          else
            TAG="v${CARGO_VERSION}"
          fi
          echo "version=${CARGO_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  publish-crate:
    runs-on: ubuntu-latest
    needs: verify-version
    env:
      CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # ---- noetl-events (workspace member) ----------------------------
      # EE-4 PR 2 (noetl/ai-meta#49): the event-envelope crate must
      # publish BEFORE noetl-executor because the executor's
      # `events` module re-exports its surface via a path+version
      # dep.  Once the crate ships its 0.1.0 here, noetl-server can
      # adopt it directly in EE-4 PR 3 instead of carrying a
      # hand-aligned EventRequest type.  Independent version (tracks
      # the wire-envelope shape, not the CLI's release cadence).
      - name: Get noetl-events version
        id: events_version
        shell: bash
        run: |
          set -euo pipefail
          EVENTS_VERSION=$(grep -E '^version = ' events/Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=${EVENTS_VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Check noetl-events version on crates.io
        id: events_check
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.events_version.outputs.version }}"
          if curl -fsS -H "User-Agent: noetl-cli-release" "https://crates.io/api/v1/crates/noetl-events/${VERSION}" >/dev/null; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Publish noetl-events
        if: ${{ env.CRATES_IO_TOKEN != '' && steps.events_check.outputs.already_published != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CRATES_IO_TOKEN }}
        shell: bash
        run: |
          set +e
          OUTPUT="$(cargo publish -p noetl-events 2>&1)"
          STATUS=$?
          set -e

          echo "${OUTPUT}"

          if [[ ${STATUS} -eq 0 ]]; then
            exit 0
          fi

          if echo "${OUTPUT}" | grep -Eqi "already uploaded|already exists"; then
            echo "noetl-events version already published; continuing."
            exit 0
          fi

          exit ${STATUS}
      - name: Skip noetl-events publish (already on crates.io)
        if: ${{ steps.events_check.outputs.already_published == 'true' }}
        run: echo "noetl-events version ${{ steps.events_version.outputs.version }} already on crates.io; skipping."

      # ---- noetl-executor (workspace member) --------------------------
      # R-1.2 PR-1: noetl-executor must publish before the noetl bin
      # because the bin depends on it from crates.io.  The executor's
      # version is independent of the bin's version -- it tracks the
      # shared-execution-core crate's API, not the CLI's release
      # cadence.
      - name: Get noetl-executor version
        id: executor_version
        shell: bash
        run: |
          set -euo pipefail
          EXECUTOR_VERSION=$(grep -E '^version = ' executor/Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=${EXECUTOR_VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Check noetl-executor version on crates.io
        id: executor_check
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.executor_version.outputs.version }}"
          if curl -fsS -H "User-Agent: noetl-cli-release" "https://crates.io/api/v1/crates/noetl-executor/${VERSION}" >/dev/null; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Publish noetl-executor
        if: ${{ env.CRATES_IO_TOKEN != '' && steps.executor_check.outputs.already_published != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CRATES_IO_TOKEN }}
        shell: bash
        run: |
          set +e
          OUTPUT="$(cargo publish -p noetl-executor 2>&1)"
          STATUS=$?
          set -e

          echo "${OUTPUT}"

          if [[ ${STATUS} -eq 0 ]]; then
            exit 0
          fi

          if echo "${OUTPUT}" | grep -Eqi "already uploaded|already exists"; then
            echo "noetl-executor version already published; continuing."
            exit 0
          fi

          exit ${STATUS}
      - name: Skip noetl-executor publish (already on crates.io)
        if: ${{ steps.executor_check.outputs.already_published == 'true' }}
        run: echo "noetl-executor version ${{ steps.executor_version.outputs.version }} already on crates.io; skipping."

      # ---- noetl-arrow-cache (workspace member) -----------------------
      # R-2.1: same shape as noetl-executor above.  Independent
      # version (tracks the Arrow IPC shared-memory cache API, not
      # the CLI's release cadence).  Downstream consumers
      # (noetl-worker, noetl-server) depend on this crate from
      # crates.io, so it must publish before they can pick up R-2.x
      # changes.
      - name: Get noetl-arrow-cache version
        id: arrow_cache_version
        shell: bash
        run: |
          set -euo pipefail
          ARROW_CACHE_VERSION=$(grep -E '^version = ' arrow-cache/Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=${ARROW_CACHE_VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Check noetl-arrow-cache version on crates.io
        id: arrow_cache_check
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.arrow_cache_version.outputs.version }}"
          if curl -fsS -H "User-Agent: noetl-cli-release" "https://crates.io/api/v1/crates/noetl-arrow-cache/${VERSION}" >/dev/null; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Publish noetl-arrow-cache
        if: ${{ env.CRATES_IO_TOKEN != '' && steps.arrow_cache_check.outputs.already_published != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CRATES_IO_TOKEN }}
        shell: bash
        run: |
          set +e
          OUTPUT="$(cargo publish -p noetl-arrow-cache 2>&1)"
          STATUS=$?
          set -e

          echo "${OUTPUT}"

          if [[ ${STATUS} -eq 0 ]]; then
            exit 0
          fi

          if echo "${OUTPUT}" | grep -Eqi "already uploaded|already exists"; then
            echo "noetl-arrow-cache version already published; continuing."
            exit 0
          fi

          exit ${STATUS}
      - name: Skip noetl-arrow-cache publish (already on crates.io)
        if: ${{ steps.arrow_cache_check.outputs.already_published == 'true' }}
        run: echo "noetl-arrow-cache version ${{ steps.arrow_cache_version.outputs.version }} already on crates.io; skipping."

      # ---- noetl-arrow-flight-client (workspace member) --------------
      # R-2.3 Phase B: same shape as the noetl-arrow-cache block above.
      # Independent version (tracks the Arrow Flight client API, not
      # the CLI's release cadence).  Pairs with the Python server in
      # noetl/noetl#643 + the wiki page
      # https://github.com/noetl/noetl/wiki/arrow_flight_result_fetch.
      - name: Get noetl-arrow-flight-client version
        id: arrow_flight_version
        shell: bash
        run: |
          set -euo pipefail
          ARROW_FLIGHT_VERSION=$(grep -E '^version = ' arrow-flight-client/Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=${ARROW_FLIGHT_VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Check noetl-arrow-flight-client version on crates.io
        id: arrow_flight_check
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.arrow_flight_version.outputs.version }}"
          if curl -fsS -H "User-Agent: noetl-cli-release" "https://crates.io/api/v1/crates/noetl-arrow-flight-client/${VERSION}" >/dev/null; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Publish noetl-arrow-flight-client
        if: ${{ env.CRATES_IO_TOKEN != '' && steps.arrow_flight_check.outputs.already_published != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CRATES_IO_TOKEN }}
        shell: bash
        run: |
          set +e
          OUTPUT="$(cargo publish -p noetl-arrow-flight-client 2>&1)"
          STATUS=$?
          set -e

          echo "${OUTPUT}"

          if [[ ${STATUS} -eq 0 ]]; then
            exit 0
          fi

          if echo "${OUTPUT}" | grep -Eqi "already uploaded|already exists"; then
            echo "noetl-arrow-flight-client version already published; continuing."
            exit 0
          fi

          exit ${STATUS}
      - name: Skip noetl-arrow-flight-client publish (already on crates.io)
        if: ${{ steps.arrow_flight_check.outputs.already_published == 'true' }}
        run: echo "noetl-arrow-flight-client version ${{ steps.arrow_flight_version.outputs.version }} already on crates.io; skipping."

      # ---- noetl + ntl binaries (workspace root) ----------------------
      - name: Check crate version on crates.io
        id: crate_check
        shell: bash
        run: |
          set -euo pipefail
          CRATE_NAME=$(grep -E '^name = ' Cargo.toml | head -1 | cut -d'"' -f2)
          VERSION="${{ needs.verify-version.outputs.version }}"
          if curl -fsS -H "User-Agent: noetl-cli-release" "https://crates.io/api/v1/crates/${CRATE_NAME}/${VERSION}" >/dev/null; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Publish crate
        if: ${{ env.CRATES_IO_TOKEN != '' && steps.crate_check.outputs.already_published != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CRATES_IO_TOKEN }}
        shell: bash
        run: |
          set +e
          OUTPUT="$(cargo publish 2>&1)"
          STATUS=$?
          set -e

          echo "${OUTPUT}"

          if [[ ${STATUS} -eq 0 ]]; then
            exit 0
          fi

          if echo "${OUTPUT}" | grep -Eqi "already uploaded|already exists"; then
            echo "Crate version already published; continuing."
            exit 0
          fi

          exit ${STATUS}
      - name: Skip publish (already exists)
        if: ${{ steps.crate_check.outputs.already_published == 'true' }}
        run: echo "Crate version already published; skipping cargo publish."
      - name: Skip publish (no token)
        if: ${{ env.CRATES_IO_TOKEN == '' }}
        run: echo "CRATES_IO_TOKEN is not set; skipping crate publish."

  build-release-assets:
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_os: linux
            artifact_arch: x86_64
          - os: ubuntu-24.04-arm
            artifact_os: linux
            artifact_arch: aarch64
          - os: macos-latest
            artifact_os: darwin
            artifact_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build binaries
        run: cargo build --release --bins
      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify-version.outputs.version }}"
          mkdir -p dist
          tar -C target/release -czf \
            "dist/noetl-v${VERSION}-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}.tar.gz" \
            noetl ntl
      - uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}
          path: dist/*.tar.gz

  build-deb:
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build binaries
        run: cargo build --release --bins
      - name: Build deb package (amd64)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify-version.outputs.version }}"
          PKG_ROOT="dist/noetl_${VERSION}-1_amd64"
          mkdir -p "${PKG_ROOT}/DEBIAN" "${PKG_ROOT}/usr/bin"
          cp target/release/noetl "${PKG_ROOT}/usr/bin/noetl"
          cp target/release/ntl "${PKG_ROOT}/usr/bin/ntl"
          cat > "${PKG_ROOT}/DEBIAN/control" <<EOF
          Package: noetl
          Version: ${VERSION}-1
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: NoETL <support@noetl.io>
          Description: NoETL workflow automation CLI
          EOF
          dpkg-deb --build "${PKG_ROOT}"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-amd64
          path: dist/*.deb

  github-release:
    runs-on: ubuntu-latest
    needs: [verify-version, build-release-assets, build-deb]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Prepare files
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -name '*.tar.gz' -o -name '*.deb' | sort > /tmp/release-files.txt
          xargs -a /tmp/release-files.txt sha256sum > dist/checksums.txt
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-version.outputs.tag }}
          files: |
            dist/**/*
          generate_release_notes: true

  update-homebrew-tap:
    runs-on: ubuntu-latest
    needs: [verify-version, github-release]
    env:
      HOMEBREW_TAP_PUSH_TOKEN: ${{ secrets.HOMEBREW_TAP_PUSH_TOKEN }}
    steps:
      - name: Check Homebrew token
        id: homebrew_token
        env:
          GH_TOKEN: ${{ env.HOMEBREW_TAP_PUSH_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          # Three-state gate:
          #   absent  -> secret not provided (fork / build without the org
          #              secret): skip green.
          #   broken  -> secret present but the token cannot access the tap
          #              repo (expired / revoked / not granted): FAIL red, so
          #              a dead publish token turns the release red instead of
          #              silently freezing the tap behind a green run.
          #   usable  -> token authenticates: proceed and push.
          if [[ -z "${HOMEBREW_TAP_PUSH_TOKEN:-}" ]]; then
            echo "usable=false" >> "${GITHUB_OUTPUT}"
            echo "HOMEBREW_TAP_PUSH_TOKEN secret is absent; will skip Homebrew tap update."
            exit 0
          fi
          # Secret present: probe real access.  Capture gh's own error text
          # and HTTP status (never the token) so 401 (dead token) is
          # distinguishable from 404 (token not granted this repo) and from a
          # transient GitHub outage.
          PROBE_OUT="$(gh api repos/noetl/homebrew-tap --jq '.full_name' 2>&1)"
          PROBE_STATUS=$?
          if [[ ${PROBE_STATUS} -eq 0 ]]; then
            echo "usable=true" >> "${GITHUB_OUTPUT}"
            echo "HOMEBREW_TAP_PUSH_TOKEN can access ${PROBE_OUT}; proceeding."
            exit 0
          fi
          HTTP_CODE="$(printf '%s' "${PROBE_OUT}" | grep -oE 'HTTP [0-9]{3}' | head -1 || true)"
          echo "::error title=Homebrew tap publish token unusable::HOMEBREW_TAP_PUSH_TOKEN is set but cannot access noetl/homebrew-tap (gh exit ${PROBE_STATUS}, ${HTTP_CODE:-status unknown}). The token is likely expired, revoked, or not granted access to the repo. Regenerate it and update the org secret, then re-run this release. gh reported: ${PROBE_OUT}"
          exit 1
      - name: Checkout tap repo
        if: ${{ steps.homebrew_token.outputs.usable == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: noetl/homebrew-tap
          token: ${{ env.HOMEBREW_TAP_PUSH_TOKEN }}
          path: tap
      - name: Update formula
        if: ${{ steps.homebrew_token.outputs.usable == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify-version.outputs.version }}"
          URL="https://github.com/noetl/cli/archive/refs/tags/v${VERSION}.tar.gz"
          SHA=$(curl -sSL "${URL}" | sha256sum | awk '{print $1}')
          cat > tap/Formula/noetl.rb <<EOF
          class Noetl < Formula
            desc "NoETL workflow automation CLI - Execute playbooks locally or orchestrate distributed pipelines"
            homepage "https://noetl.io"
            url "${URL}"
            sha256 "${SHA}"
            license "MIT"
            head "https://github.com/noetl/cli.git", branch: "main"
            depends_on "rust" => :build

            def install
              system "cargo", "install", "--bins", *std_cargo_args
            end

            test do
              assert_match "noetl", shell_output("#{bin}/noetl --version")
              assert_match "ntl", shell_output("#{bin}/ntl --version")
            end
          end
          EOF
      - name: Commit and push
        if: ${{ steps.homebrew_token.outputs.usable == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/noetl.rb
          git commit -m "noetl ${{ needs.verify-version.outputs.version }}" || exit 0
          git push origin HEAD:main
      - name: Skip tap publish (no secret)
        if: ${{ steps.homebrew_token.outputs.usable == 'false' }}
        run: |
          echo "::warning title=Homebrew tap not updated::HOMEBREW_TAP_PUSH_TOKEN is not provided (e.g. a fork or a build without the org secret); skipping Homebrew tap update. The tap formula was NOT bumped for this release. This is expected for forks; on the noetl/cli release pipeline it means the secret is missing. (A token that is present but unusable fails the job instead of reaching this step.)"
          echo "HOMEBREW_TAP_PUSH_TOKEN is not provided; skipping Homebrew tap update."

  update-apt-repo:
    runs-on: ubuntu-latest
    needs: [verify-version, build-deb, github-release]
    env:
      APT_REPO_PUSH_TOKEN: ${{ secrets.APT_REPO_PUSH_TOKEN }}
    steps:
      - name: Check APT token
        id: apt_token
        env:
          GH_TOKEN: ${{ env.APT_REPO_PUSH_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          # Three-state gate:
          #   absent  -> secret not provided (fork / build without the org
          #              secret): skip green.
          #   broken  -> secret present but the token cannot access the apt
          #              repo (expired / revoked / not granted): FAIL red, so
          #              a dead publish token turns the release red instead of
          #              silently freezing the apt index behind a green run.
          #   usable  -> token authenticates: proceed and push.
          if [[ -z "${APT_REPO_PUSH_TOKEN:-}" ]]; then
            echo "usable=false" >> "${GITHUB_OUTPUT}"
            echo "APT_REPO_PUSH_TOKEN secret is absent; will skip APT repo update."
            exit 0
          fi
          # Secret present: probe real access.  Capture gh's own error text
          # and HTTP status (never the token) so 401 (dead token) is
          # distinguishable from 404 (token not granted this repo) and from a
          # transient GitHub outage.
          PROBE_OUT="$(gh api repos/noetl/apt --jq '.full_name' 2>&1)"
          PROBE_STATUS=$?
          if [[ ${PROBE_STATUS} -eq 0 ]]; then
            echo "usable=true" >> "${GITHUB_OUTPUT}"
            echo "APT_REPO_PUSH_TOKEN can access ${PROBE_OUT}; proceeding."
            exit 0
          fi
          HTTP_CODE="$(printf '%s' "${PROBE_OUT}" | grep -oE 'HTTP [0-9]{3}' | head -1 || true)"
          echo "::error title=APT publish token unusable::APT_REPO_PUSH_TOKEN is set but cannot access noetl/apt (gh exit ${PROBE_STATUS}, ${HTTP_CODE:-status unknown}). The token is likely expired, revoked, or not granted access to the repo. Regenerate it and update the org secret, then re-run this release. gh reported: ${PROBE_OUT}"
          exit 1
      - uses: actions/download-artifact@v4
        if: ${{ steps.apt_token.outputs.usable == 'true' }}
        with:
          name: deb-amd64
          path: dist
      - name: Install apt tooling
        if: ${{ steps.apt_token.outputs.usable == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils
      - name: Checkout apt repo
        if: ${{ steps.apt_token.outputs.usable == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: noetl/apt
          token: ${{ env.APT_REPO_PUSH_TOKEN }}
          path: apt
      - name: Update apt metadata
        if: ${{ steps.apt_token.outputs.usable == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd apt
          # Ubuntu suites served from the shared pool/main.  Add a new
          # codename here (e.g. plucky) and it is indexed on the next
          # release automatically -- no per-suite block to copy.  This loop
          # replaces a hardcoded jammy-only block; dists/noble silently
          # rotted at 2.13.0 for months because the old block only ever
          # regenerated jammy while the .deb landed in the shared pool.
          DISTS="jammy noble"
          mkdir -p pool/main
          cp ../dist/*.deb pool/main/
          for DIST in ${DISTS}; do
            mkdir -p "dists/${DIST}/main/binary-amd64"
            dpkg-scanpackages pool/main /dev/null \
              > "dists/${DIST}/main/binary-amd64/Packages"
            gzip -9c "dists/${DIST}/main/binary-amd64/Packages" \
              > "dists/${DIST}/main/binary-amd64/Packages.gz"
            apt-ftparchive release "dists/${DIST}" > "dists/${DIST}/Release"
          done
      - name: Commit and push
        if: ${{ steps.apt_token.outputs.usable == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd apt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pool dists
          git commit -m "noetl ${{ needs.verify-version.outputs.version }}" || exit 0
          git push origin HEAD:main
      - name: Skip APT publish (no secret)
        if: ${{ steps.apt_token.outputs.usable == 'false' }}
        run: |
          echo "::warning title=APT repo not updated::APT_REPO_PUSH_TOKEN is not provided (e.g. a fork or a build without the org secret); skipping APT repo update. The .deb was attached to the GitHub release but the apt repository index was NOT updated for this release. This is expected for forks; on the noetl/cli release pipeline it means the secret is missing. (A token that is present but unusable fails the job instead of reaching this step.)"
          echo "APT_REPO_PUSH_TOKEN is not provided; skipping APT repo update."
